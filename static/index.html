<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 8%, #25345c 0, transparent 38%),
        radial-gradient(ellipse at 90% 90%, #30204c 0, transparent 34%),
        #0b1020;
    }

    .calculator {
      width: min(100%, 390px);
      padding: 24px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 28px;
      background: rgb(19 26 45 / 88%);
      box-shadow: 0 28px 80px rgb(0 0 0 / 42%);
      backdrop-filter: blur(16px);
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .badge {
      color: #a7f3d0;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .screen {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      padding: 16px 4px 20px;
      text-align: right;
    }

    .expression {
      width: 100%;
      min-height: 24px;
      overflow: hidden;
      color: #9aa6c2;
      font-size: .9rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display {
      width: 100%;
      overflow: hidden;
      font-size: clamp(2.5rem, 11vw, 3.6rem);
      font-weight: 350;
      letter-spacing: -.055em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 64px;
      border: 1px solid transparent;
      border-radius: 18px;
      background: #202a42;
      color: #f5f7ff;
      cursor: pointer;
      font: inherit;
      font-size: 1.18rem;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #2a3652; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 2px solid #8b9cff; outline-offset: 2px; }
    button.utility { background: #303b55; color: #cbd5ed; }
    button.operator { background: #293454; color: #b6c4ff; font-size: 1.35rem; }
    button.selected { background: #6577e8; color: white; }
    button.equals {
      background: linear-gradient(135deg, #7687ff, #8b5cf6);
      box-shadow: 0 8px 22px rgb(111 112 239 / 28%);
    }
    button.zero { grid-column: span 2; }

    .message {
      min-height: 20px;
      margin: 12px 2px 0;
      color: #fda4af;
      font-size: .8rem;
      text-align: right;
    }

    @media (max-width: 420px) {
      .calculator { padding: 20px; }
      button { min-height: 58px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="heading">
      <h1>Calculator</h1>
      <span class="badge">Ready</span>
    </header>
    <section class="screen" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="display" id="display">0</div>
    </section>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="utility" data-action="sign" aria-label="Change sign">±</button>
      <button class="operator" data-operation="divide" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operation="multiply" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operation="subtract" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operation="add" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
    <p class="message" id="message" role="status"></p>
  </main>

  <script>
    const display = document.querySelector("#display");
    const expression = document.querySelector("#expression");
    const message = document.querySelector("#message");
    let current = "0";
    let firstOperand = null;
    let operation = null;
    let startNewNumber = false;

    const symbols = { add: "+", subtract: "−", multiply: "×", divide: "÷" };

    function render() {
      display.textContent = current;
      expression.textContent = firstOperand === null
        ? ""
        : `${firstOperand} ${symbols[operation] || ""}`;
    }

    function clear() {
      current = "0";
      firstOperand = null;
      operation = null;
      startNewNumber = false;
      message.textContent = "";
      render();
    }

    function enterDigit(digit) {
      message.textContent = "";
      if (startNewNumber) {
        current = digit;
        startNewNumber = false;
      } else if (current === "0") {
        current = digit;
      } else if (current.length < 15) {
        current += digit;
      }
      render();
    }

    async function chooseOperation(nextOperation) {
      message.textContent = "";
      if (operation && !startNewNumber) {
        await calculate();
        if (message.textContent) return;
      }
      firstOperand = Number(current);
      operation = nextOperation;
      startNewNumber = true;
      render();
      document.querySelectorAll("[data-operation]").forEach((button) => {
        button.classList.toggle("selected", button.dataset.operation === operation);
      });
    }

    async function calculate() {
      if (firstOperand === null || operation === null) return;
      const secondOperand = Number(current);
      try {
        const response = await fetch("/api/calc", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ a: firstOperand, b: secondOperand, operation })
        });
        const body = await response.text();
        let data;
        try {
          data = JSON.parse(body);
        } catch {
          throw new Error(response.ok
            ? "The calculator server returned an invalid response."
            : `Calculator API returned HTTP ${response.status}. Start the app through the FastAPI server.`);
        }
        if (!response.ok) throw new Error(data.detail || "Calculation failed.");
        current = String(Number(data.result.toPrecision(12)));
        expression.textContent = `${firstOperand} ${symbols[operation]} ${secondOperand} =`;
        firstOperand = null;
        operation = null;
        startNewNumber = true;
        message.textContent = "";
        document.querySelectorAll("[data-operation]").forEach((button) => button.classList.remove("selected"));
        display.textContent = current;
      } catch (error) {
        message.textContent = error.message;
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operation) chooseOperation(button.dataset.operation);
      else if (button.dataset.action === "clear") clear();
      else if (button.dataset.action === "equals") calculate();
      else if (button.dataset.action === "decimal") {
        if (startNewNumber) {
          current = "0.";
          startNewNumber = false;
        } else if (!current.includes(".")) current += ".";
        render();
      } else if (button.dataset.action === "delete") {
        if (!startNewNumber) current = current.length > 1 ? current.slice(0, -1) : "0";
        render();
      } else if (button.dataset.action === "sign" && Number(current) !== 0) {
        current = String(-Number(current));
        render();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") document.querySelector('[data-action="decimal"]').click();
      else if (event.key === "Escape") clear();
      else if (event.key === "Backspace") document.querySelector('[data-action="delete"]').click();
      else if (event.key === "Enter" || event.key === "=") calculate();
      else {
        const operations = { "+": "add", "-": "subtract", "*": "multiply", "/": "divide" };
        if (operations[event.key]) chooseOperation(operations[event.key]);
      }
    });
  </script>
</body>
</html>
